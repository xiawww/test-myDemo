<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢迎来到福诺公司</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #4a90d9 100%);
    overflow: hidden;
    position: relative;
  }

  /* 背景装饰光斑 */
  .glow {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    animation: float 8s ease-in-out infinite;
  }
  .glow-1 { width: 400px; height: 400px; top: -100px; left: -100px; }
  .glow-2 { width: 300px; height: 300px; bottom: -80px; right: -60px; animation-delay: 2s; }
  .glow-3 { width: 200px; height: 200px; top: 40%; right: 15%; animation-delay: 4s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-30px) scale(1.05); }
  }

  .deco-icon {
    position: absolute;
    width: 120px;
    height: 120px;
    object-fit: contain;
    border-radius: 50%;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
    animation: floatIcon 6s ease-in-out infinite;
  }
  .deco-1 { top: 8%; left: 10%; width: 130px; height: 130px; }
  .deco-2 { top: 12%; right: 9%; width: 100px; height: 100px; animation-delay: 1.5s; }
  .deco-3 { bottom: 10%; left: 12%; width: 100px; height: 100px; animation-delay: 3s; }
  .deco-4 { bottom: 8%; right: 11%; width: 140px; height: 140px; animation-delay: 4.5s; }

  @keyframes floatIcon {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-22px) rotate(4deg); }
  }

  .welcome-card {
    position: relative;
    text-align: center;
    color: #fff;
    padding: 60px 80px;
    animation: fadeInUp 1.2s ease-out;
    z-index: 1;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo {
    font-size: 28px;
    letter-spacing: 8px;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 40px;
  }

  .logo span {
    display: inline-block;
    width: 50px;
    height: 2px;
    background: rgba(255, 255, 255, 0.5);
    vertical-align: middle;
    margin: 0 16px;
  }

  h1 {
    font-size: 56px;
    font-weight: 500;
    letter-spacing: 4px;
    margin-bottom: 24px;
  }

  .subtitle {
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.8);
    margin-bottom: 50px;
  }

  .divider {
    width: 60px;
    height: 3px;
    background: #7eb8ff;
    margin: 0 auto 50px;
    border-radius: 2px;
  }

  .slogan {
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.65);
  }

  @media (max-width: 600px) {
    .welcome-card { padding: 40px 24px; }
    h1 { font-size: 36px; }
    .subtitle { font-size: 16px; }
    .deco-1, .deco-4 { width: 80px; height: 80px; }
    .deco-2, .deco-3 { width: 64px; height: 64px; }
  }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <img class="deco-icon deco-1" src="static/Slice 1.png" alt="购物车">
  <img class="deco-icon deco-2" src="static/Slice 2.png" alt="提示">
  <img class="deco-icon deco-3" src="static/Slice 2@2x.png" alt="提示">
  <img class="deco-icon deco-4" src="static/Slice 1@2x.png" alt="购物车">

  <div class="welcome-card">
    <div class="logo"><span></span>FUNUO<span></span></div>
    <h1>欢迎来到福诺公司</h1>
    <p class="subtitle">WELCOME TO FUNUO</p>
    <div class="divider"></div>
    <p class="slogan">诚信 · 专业 · 创新 · 共赢</p>
  </div>
</body>
</html>
